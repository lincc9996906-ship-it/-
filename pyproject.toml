[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meihua-yi"
version = "0.1.1"
description = "梅花易数起卦工具 - Python I Ching divination engine"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "maolige", email = "maolige@example.com"},
]
keywords = ["meihua", "yi", "iching", "divination", "六十四卦", "易经"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
lunar = ["lunardate"]
dev = ["pytest>=7.0"]

[project.scripts]
meihua = "meihua_yi.cli:main"

[project.urls]
Homepage = "https://github.com/handsomejustin/meihua-yi"
Repository = "https://github.com/handsomejustin/meihua-yi"
"Bug Tracker" = "https://github.com/handsomejustin/meihua-yi/issues"

[tool.setuptools.packages.find]
include = ["meihua_yi*"]